<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo de Apoio à Decisão - Menopausa</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #006699;
            --primary-dark: #004d73;
            --secondary: #00a88f;
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --success-bg: #f0fdf4;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Source Sans Pro', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 580px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header-bar {
            background: var(--primary);
            color: white;
            padding: 10px 16px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .content {
            padding: 16px;
        }

        .step-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        /* Caixa Estilo Decisão (Losango / Pergunta Compacta) */
        .decision-box {
            background: #fff;
            border: 2px solid #f87171; /* Cor rosa/vermelha idêntica aos losangos do diagrama */
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            margin-bottom: 14px;
        }

        .question-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .asterisk-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.2;
        }

        /* Botões Compactos Lado a Lado */
        .binary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-binary {
            border: 1.5px solid var(--border);
            background: #ffffff;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            color: var(--text-main);
        }

        .btn-binary.yes:hover {
            background-color: var(--success-bg);
            border-color: var(--success);
            color: var(--success);
        }

        .btn-binary.no:hover {
            background-color: var(--danger-bg);
            border-color: var(--danger);
            color: var(--danger);
        }

        /* Lista Compacta de Sintomas */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-option {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-option:hover {
            border-color: var(--primary);
            background-color: #f0f7fa;
            color: var(--primary);
        }

        /* Caixas de Resultado Idênticas ao Diagrama (Rectângulos Azuis / Vermelhos) */
        .result-box {
            padding: 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            line-height: 1.35;
            margin-bottom: 12px;
            border: 1.5px solid;
        }

        .result-box.urgent {
            background-color: var(--danger-bg);
            border-color: #fca5a5;
            color: #991b1b;
        }

        .result-box.info {
            background-color: #f0f9ff;
            border-color: #bae6fd;
            color: #0369a1;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 6px;
        }

        .btn-action:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 5px;
            width: 100%;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            Algoritmo de Apoio à Decisão na Menopausa
        </div>

        <div class="content" id="appContent">
            <!-- Conteúdo carregado dinamicamente -->
        </div>
    </div>

    <script>
        let historyStack = [];

        const treeData = {
            /* FLUXO INICIAL RIGOROSO DO DIAGRAMA */
            start: {
                tag: "Triagem Inicial",
                title: "A utente apresenta sintomas associados à menopausa?",
                binary: true,
                yes: { next: "q_idade" },
                no: { result: "Sem indicação para aplicação do algoritmo de menopausa.", urgent: false }
            },
            q_idade: {
                tag: "Triagem Inicial",
                title: "A utente tem idade < 45 anos?",
                binary: true,
                yes: { result: "Encaminhamento para consulta médica (Avaliação de Menopausa Precoce <45 anos ou Insuficiência Ovárica Prematura <40 anos).", urgent: true },
                no: { next: "q_imc" }
            },
            q_imc: {
                tag: "Avaliação Antropométrica",
                title: "Índice de Massa Corporal (IMC) > 27?",
                binary: true,
                yes: { result: "Perda ponderal de 10% associada à redução da intensidade dos afrontamentos. Reforçar a importância da dieta equilibrada e de exercício físico.", next: "q_evitar_hormonas" },
                no: { next: "q_evitar_hormonas" }
            },
            q_evitar_hormonas: {
                tag: "Opção Terapêutica",
                title: "A utente prefere evitar hormonas?",
                binary: true,
                yes: { next: "q_menqol" },
                no: { result: "Encaminhamento para consulta médica.", urgent: true }
            },
            q_menqol: {
                tag: "Avaliação de Impacto (MENQOL*)",
                title: "Os sintomas graves, persistentes ou apresentam impacto significativo na qualidade de vida?",
                note: "*MENQOL (Menopause-Specific Quality of Life Questionnaire): Aplicação de questionário de qualidade de vida.",
                binary: true,
                yes: { result: "Encaminhamento para consulta médica.", urgent: true },
                no: { next: "q_predominante" }
            },
            q_predominante: {
                tag: "Sintoma A Avaliar",
                title: "Qual o sintoma predominante ou principal queixa da utente?",
                options: [
                    { text: "1. Sintomas Vasomotores (Afrontamentos / Suores noturnos)", next: "vaso_1" },
                    { text: "2. Sintomas Geniturinários", next: "genitu_1" },
                    { text: "3. Saúde Óssea", next: "ossea_1" },
                    { text: "4. Perturbações do Sono", next: "sono_1" },
                    { text: "5. Alterações Psicológicas", next: "psico_1" },
                    { text: "6. Alterações Cognitivas", next: "cog_1" },
                    { text: "7. Alterações Metabólicas", next: "meta_1" },
                    { text: "8. Alterações Cutâneas", next: "cut_1" }
                ]
            },

            /* 1. SINTOMAS VASOMOTORES */
            vaso_1: {
                tag: "Vasomotores",
                title: "Histórico de Cancro Hormono-dependente?",
                binary: true,
                yes: { result: "Não recomendar fitoestrogénios sem avaliação médica.", urgent: true },
                no: { next: "vaso_2" }
            },
            vaso_2: {
                tag: "Vasomotores",
                title: "A utente é fumadora?",
                binary: true,
                yes: { next: "vaso_3" },
                no: { next: "vaso_4" }
            },
            vaso_3: {
                tag: "Vasomotores",
                title: "Informar sobre o possível agravamento dos sintomas vasomotores e promover a cessação tabágica.<br><br>Existe limitação à utilização de fitoestrogénios?",
                binary: true,
                yes: { next: "vaso_5" },
                no: { result: "Considerar Isoflavonas de soja (Glycine max) 40–72 mg/dia." }
            },
            vaso_4: {
                tag: "Vasomotores",
                title: "Existe limitação à utilização de fitoestrogénios?",
                binary: true,
                yes: { next: "vaso_5" },
                no: { result: "Considerar Isoflavonas de soja (Glycine max) 40–72 mg/dia." }
            },
            vaso_5: {
                tag: "Vasomotores",
                title: "Patologia Hepática?",
                binary: true,
                yes: { result: "Evitar Erva-de-são-cristóvão (Cimicifuga racemosa). Considerar Extrato de Pólen purificado.", urgent: true },
                no: { next: "vaso_6" }
            },
            vaso_6: {
                tag: "Vasomotores",
                title: "Tomada de Antidepressivos?",
                binary: true,
                yes: { result: "Evitar Erva-de-são-joão (Hypericum perforatum) devido ao risco de interação." },
                no: { result: "Considerar Extrato de Pólen purificado ou Erva-de-são-cristóvão (Cimicifuga racemosa)." }
            },

            /* 2. SINTOMAS GENITURINÁRIOS */
            genitu_1: {
                tag: "Geniturinários",
                title: "Apresenta hemorragia pós-menopausa?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { next: "genitu_2" }
            },
            genitu_2: {
                tag: "Geniturinários",
                title: "Apresenta sintomas sugestivos de infeção urinária ou candidíase?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { next: "genitu_3" }
            },
            genitu_3: {
                tag: "Geniturinários",
                title: "Apresenta secura, ardor ou desconforto vaginal?",
                binary: true,
                yes: { result: "Hidratantes Vaginais Não Hormonais (com Ácido Hialurónico, fitoestrogénios ou pectina). Utilização regular 2 a 3 vezes por semana ou diária se necessário." },
                no: { next: "genitu_4" }
            },
            genitu_4: {
                tag: "Geniturinários",
                title: "Existe dor/desconforto apenas no coito (Dispareunia)?",
                binary: true,
                yes: { result: "Lubrificantes vaginais durante a atividade sexual (Verificar compatibilidade com preservativos de látex)." },
                no: { result: "Reavaliar sintomatologia local." }
            },

            /* 3. SAÚDE ÓSSEA */
            ossea_1: {
                tag: "Saúde Óssea",
                title: "Diagnóstico de Osteoporose ou Osteopenia?",
                binary: true,
                yes: { result: "Encaminhamento médico e reforço das medidas não farmacológicas de suporte à saúde óssea.", urgent: true },
                no: { next: "ossea_2" }
            },
            ossea_2: {
                tag: "Saúde Óssea",
                title: "Apresenta fratura por fragilidade?",
                binary: true,
                yes: { result: "Encaminhamento para consulta médica.", urgent: true },
                no: { next: "ossea_3" }
            },
            ossea_3: {
                tag: "Saúde Óssea",
                title: "Apresenta dor articular?",
                binary: true,
                yes: { result: "Avaliação da causa, intensidade, duração e impacto funcional. Encaminhamento médico se necessário." },
                no: { next: "ossea_4" }
            },
            ossea_4: {
                tag: "Saúde Óssea",
                title: "Ingestão diária de Cálcio insuficiente (< 1000 mg/dia)?",
                binary: true,
                yes: { result: "Aconselhar suplemento de Cálcio para complementar a Ingestão diária." },
                no: { next: "ossea_5" }
            },
            ossea_5: {
                tag: "Saúde Óssea",
                title: "Níveis de Vitamina D3 inadequados (< 20 ng/mL)?",
                binary: true,
                yes: { result: "Aconselhar suplementação com Vitamina D3 (800-1000 UI/dia)." },
                no: { result: "Manter aporte adequado de Cálcio e Vitamina D3." }
            },

            /* 4. PERTURBAÇÕES DO SONO */
            sono_1: {
                tag: "Perturbações do Sono",
                title: "Está associada a afrontamentos e/ou suores noturnos?",
                binary: true,
                yes: { result: "Priorizar o alívio dos sintomas vasomotores." },
                no: { next: "sono_2" }
            },
            sono_2: {
                tag: "Perturbações do Sono",
                title: "Apresenta características de insónia grave ou refratária?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { next: "sono_3" }
            },
            sono_3: {
                tag: "Perturbações do Sono",
                title: "Sintomas de ansiedade, stress ou alterações do humor?",
                binary: true,
                yes: { result: "Medidas de higiene do sono e suplementar Melatonina ou Valeriana/Passiflora." },
                no: { result: "Medidas de higiene do sono e suplementar Melatonina." }
            },

            /* 5. ALTERAÇÕES PSICOLÓGICAS */
            psico_1: {
                tag: "Alterações Psicológicas",
                title: "Alteração marcada da personalidade, depressão grave ou ideação suicida?",
                binary: true,
                yes: { result: "Encaminhamento médico imediato.", urgent: true },
                no: { next: "psico_2" }
            },
            psico_2: {
                tag: "Alterações Psicológicas",
                title: "Apresenta instabilidade de humor?",
                binary: true,
                yes: { result: "Medidas gerais de suporte: exercício físico, higiene do sono, gestão do stress e apoio psicológico." },
                no: { result: "Manter medidas gerais de suporte." }
            },

            /* 6. ALTERAÇÕES COGNITIVAS */
            cog_1: {
                tag: "Alterações Cognitivas",
                title: "Sintomas graves e/ou incapacitantes?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { next: "cog_2" }
            },
            cog_2: {
                tag: "Alterações Cognitivas",
                title: "Consumo adequado de peixe gordo? (1 a 2 vezes por semana)",
                binary: true,
                yes: { result: "Manter aporte alimentar." },
                no: { result: "Considerar suplementação com Omega 3 (DHA/EPA)." }
            },

            /* 7. ALTERAÇÕES METABÓLICAS */
            meta_1: {
                tag: "Alterações Metabólicas",
                title: "Triglicéridos altos ou Risco Cardiovascular Elevado?",
                binary: true,
                yes: { result: "Considerar Omega 3." },
                no: { next: "meta_2" }
            },
            meta_2: {
                tag: "Alterações Metabólicas",
                title: "Diabetes Mellitus 2?",
                binary: true,
                yes: { result: "Encaminhar para consulta médica.", urgent: true },
                no: { result: "Manter estilo de vida saudável e monitorização regular." }
            },

            /* 8. ALTERAÇÕES CUTÂNEAS */
            cut_1: {
                tag: "Alterações Cutâneas",
                title: "Proteção Solar Diária (Prevenção de Fotoenvelhecimento)?",
                binary: true,
                yes: { next: "cut_2" },
                no: { result: "Aconselhar uso diário de fotoprotetor de amplo espectro (FPS 30-50+)." }
            },
            cut_2: {
                tag: "Alterações Cutâneas",
                title: "Apresenta secura, rugas finas ou flacidez?",
                binary: true,
                yes: { result: "Aconselhar cosmética de estimulação lipídica/colagénio, emolientes e Ácido Hialurónico tópico." },
                no: { next: "cut_3" }
            },
            cut_3: {
                tag: "Alterações Cutâneas",
                title: "Apresenta queda de cabelo ou perda de volume capilar?",
                binary: true,
                yes: { result: "Dermocosméticos capilares e suplementar vitaminas do complexo B, Zinco." },
                no: { result: "Manter rotina dermocosmética habitual." }
            }
        };

        function renderNode(nodeKey) {
            const app = document.getElementById('appContent');
            const node = treeData[nodeKey];

            if (!node) return;

            let html = `<span class="step-tag">${node.tag}</span>`;
            
            html += `<div class="decision-box">`;
            html += `<div class="question-title">${node.title}</div>`;
            if (node.note) {
                html += `<div class="asterisk-note">${node.note}</div>`;
            }
            html += `</div>`;

            if (node.binary) {
                html += `
                    <div class="binary-grid">
                        <button class="btn-binary yes" onclick="handleSelect('${nodeKey}', 'yes')">SIM</button>
                        <button class="btn-binary no" onclick="handleSelect('${nodeKey}', 'no')">NÃO</button>
                    </div>
                `;
            } else if (node.options) {
                html += `<div class="options-list">`;
                node.options.forEach((opt, idx) => {
                    html += `<button class="btn-option" onclick="handleSelect('${nodeKey}', ${idx})">${opt.text} <span>→</span></button>`;
                });
                html += `</div>`;
            }

            app.innerHTML = html;
        }

        function handleSelect(nodeKey, choice) {
            const node = treeData[nodeKey];
            let target;

            if (node.binary) {
                target = node[choice];
            } else if (node.options) {
                target = node.options[choice];
            }

            if (target.result) {
                showResult(target.result, target.urgent, target.next);
            } else if (target.next) {
                renderNode(target.next);
            }
        }

        function showResult(text, isUrgent = false, nextStep = null) {
            const app = document.getElementById('appContent');
            const resultClass = isUrgent ? 'urgent' : 'info';
            const icon = isUrgent ? '🔴' : '🔹';

            let html = `
                <div class="result-box ${resultClass}">
                    <strong>${icon} Recomendação / Decisão:</strong><br><br>${text}
                </div>
            `;

            if (nextStep) {
                html += `<button class="btn-action" onclick="renderNode('${nextStep}')">Prosseguir para Próximo Passo →</button>`;
            } else {
                html += `<button class="btn-action" onclick="renderNode('q_predominante')">➕ Avaliar Outro Sintoma</button>`;
            }

            html += `<button class="btn-secondary" onclick="resetSession()">🔄 Recomeçar Algoritmo</button>`;

            app.innerHTML = html;
        }

        function resetSession() {
            renderNode('start');
        }

        renderNode('start');
    </script>

</body>
</html>
