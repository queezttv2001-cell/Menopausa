<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo de Apoio à Decisão - Menopausa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;       /* Azul Escuro Profissional */
            --accent: #0284c7;        /* Azul Clínico */
            --accent-hover: #0369a1;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-dark: #0f172a;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-border: #fca5a5;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --success-border: #6ee7b7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
        }

        .app-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 640px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary);
            color: #ffffff;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .header-sub {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
        }

        .content {
            padding: 28px 24px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: #e0f2fe;
            color: var(--accent);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-card {
            background-color: #ffffff;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            transition: border-color 0.2s;
        }

        .question-card:hover {
            border-color: #cbd5e1;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .note-text {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            font-size: 0.85rem;
            color: #64748b;
            line-height: 1.4;
        }

        /* Grelha de Decisão (Sim/Não) */
        .binary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-decision {
            background: #ffffff;
            border: 2px solid var(--border);
            padding: 16px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-dark);
            text-align: center;
        }

        .btn-decision.yes:hover {
            border-color: var(--success);
            background-color: var(--success-bg);
            color: #065f46;
        }

        .btn-decision.no:hover {
            border-color: var(--danger);
            background-color: var(--danger-bg);
            color: #991b1b;
        }

        /* Lista de Seleção de Sintomas */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-select {
            background: #ffffff;
            border: 1.5px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-select:hover {
            border-color: var(--accent);
            background-color: #f0f9ff;
            color: var(--accent);
            transform: translateY(-1px);
        }

        /* Cartões de Recomendações / Resultados */
        .result-box {
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid;
            line-height: 1.6;
            font-size: 0.98rem;
        }

        .result-box.urgent {
            background-color: var(--danger-bg);
            border-color: var(--danger-border);
            color: #7f1d1d;
        }

        .result-box.info {
            background-color: var(--success-bg);
            border-color: var(--success-border);
            color: #064e3b;
        }

        .result-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Botões de Ação */
        .btn-primary-action {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            width: 100%;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }

        .btn-primary-action:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary-action {
            background: transparent;
            color: #64748b;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary-action:hover {
            background-color: #f1f5f9;
            color: var(--text-dark);
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header">
            <div class="header-sub">Algoritmo de Apoio à Decisão</div>
            <div class="header-title">Aconselhamento de Produtos na Menopausa</div>
        </div>

        <div class="content" id="appContent">
            <!-- Conteúdo dinâmico -->
        </div>
    </div>

    <script>
        const treeData = {
            /* TRIAGEM INICIAL DO FLUXOGRAMA */
            start: {
                tag: "Triagem Inicial",
                title: "A utente apresenta sintomas associados à menopausa?",
                binary: true,
                yes: { next: "q_idade" },
                no: { result: "Sem indicação para aplicação do algoritmo de menopausa. Avaliar outras queixas da utente.", urgent: false }
            },
            q_idade: {
                tag: "Triagem Inicial",
                title: "A utente tem idade < 45 anos?",
                binary: true,
                yes: { result: "Encaminhamento médico para avaliação de Menopausa Precoce (<45 anos) ou Insuficiência Ovárica Prematura (<40 anos).", urgent: true },
                no: { next: "q_imc" }
            },
            q_imc: {
                tag: "Avaliação Antropométrica",
                title: "Índice de Massa Corporal (IMC) > 27?",
                binary: true,
                yes: { result: "Perda ponderal de 10% associada à redução da intensidade dos afrontamentos. Reforçar a importância da dieta equilibrada e de exercício físico.", next: "q_evitar_hormonas" },
                no: { next: "q_evitar_hormonas" }
            },
            q_evitar_hormonas: {
                tag: "Opção Terapêutica",
                title: "A utente prefere evitar hormonas?",
                binary: true,
                yes: { next: "q_menqol" },
                no: { result: "Encaminhamento para consulta médica para avaliação de Terapêutica Hormonal.", urgent: true }
            },
            q_menqol: {
                tag: "Avaliação de Impacto (MENQOL*)",
                title: "Os sintomas são graves, persistentes ou apresentam impacto significativo na qualidade de vida?",
                note: "*MENQOL (Menopause-Specific Quality of Life Questionnaire): Questionário de Qualidade de Vida Específico da Menopausa.",
                binary: true,
                yes: { result: "Encaminhamento para consulta médica devido ao elevado impacto na qualidade de vida.", urgent: true },
                no: { next: "q_predominante" }
            },
            q_predominante: {
                tag: "Seleção do Sintoma",
                title: "Qual o sintoma predominante ou principal queixa?",
                options: [
                    { text: "1. Sintomas Vasomotores (Afrontamentos / Suores noturnos)", next: "vaso_1" },
                    { text: "2. Sintomas Geniturinários", next: "genitu_1" },
                    { text: "3. Saúde Óssea", next: "ossea_1" },
                    { text: "4. Perturbações do Sono", next: "sono_1" },
                    { text: "5. Alterações Psicológicas", next: "psico_1" },
                    { text: "6. Alterações Cognitivas", next: "cog_1" },
                    { text: "7. Alterações Metabólicas", next: "meta_1" },
                    { text: "8. Alterações Cutâneas", next: "cut_1" }
                ]
            },

            /* 1. SINTOMAS VASOMOTORES */
            vaso_1: {
                tag: "Vasomotores",
                title: "Histórico de Cancro Hormono-dependente? (ex: Mama, Endométrio)",
                binary: true,
                yes: { result: "Precaução com fitoestrogénios (ex: Soja, Trevo Vermelho). Encaminhamento para avaliação médica.", urgent: true },
                no: { next: "vaso_2" }
            },
            vaso_2: {
                tag: "Vasomotores",
                title: "A utente é fumadora?",
                binary: true,
                yes: { next: "vaso_3" },
                no: { next: "vaso_4" }
            },
            vaso_3: {
                tag: "Vasomotores",
                title: "Informar sobre o possível agravamento dos sintomas vasomotores e promover a cessação tabágica.<br><br>Existe limitação à utilização de fitoestrogénios?",
                binary: true,
                yes: { next: "vaso_5" },
                no: { result: "Considerar Isoflavonas de soja (Glycine max) 40–72 mg/dia." }
            },
            vaso_4: {
                tag: "Vasomotores",
                title: "Existe limitação à utilização de fitoestrogénios?",
                binary: true,
                yes: { next: "vaso_5" },
                no: { result: "Considerar Isoflavonas de soja (Glycine max) 40–72 mg/dia." }
            },
            vaso_5: {
                tag: "Vasomotores",
                title: "Patologia Hepática?",
                binary: true,
                yes: { result: "Evitar Erva-de-são-cristóvão (Cimicifuga racemosa). Considerar Extrato de Pólen purificado.", urgent: true },
                no: { next: "vaso_6" }
            },
            vaso_6: {
                tag: "Vasomotores",
                title: "Tomada de Antidepressivos?",
                binary: true,
                yes: { result: "Evitar Erva-de-são-joão (Hypericum perforatum) devido ao risco de síndrome serotoninérgica." },
                no: { result: "Considerar Extrato de Pólen purificado ou Erva-de-são-cristóvão (Cimicifuga racemosa)." }
            },

            /* 2. SINTOMAS GENITURINÁRIOS */
            genitu_1: {
                tag: "Geniturinários",
                title: "Apresenta hemorragia pós-menopausa?",
                binary: true,
                yes: { result: "Encaminhamento médico imediato por hemorragia pós-menopausa.", urgent: true },
                no: { next: "genitu_2" }
            },
            genitu_2: {
                tag: "Geniturinários",
                title: "Apresenta sintomas sugestivos de infeção urinária ou candidíase?",
                binary: true,
                yes: { result: "Encaminhamento médico por suspeita de infeção.", urgent: true },
                no: { next: "genitu_3" }
            },
            genitu_3: {
                tag: "Geniturinários",
                title: "Apresenta secura, ardor ou desconforto vaginal?",
                binary: true,
                yes: { result: "Hidratantes Vaginais Não Hormonais (com Ácido Hialurónico, fitoestrogénios, pectina). Utilização regular 2 a 3 vezes por semana." },
                no: { next: "genitu_4" }
            },
            genitu_4: {
                tag: "Geniturinários",
                title: "Existe dor/desconforto apenas no coito (Dispareunia)?",
                binary: true,
                yes: { result: "Lubrificantes vaginais durante a atividade sexual (Verificar compatibilidade com preservativos de látex)." },
                no: { result: "Reavaliar sintomatologia local e promover higiene íntima adequada." }
            },

            /* 3. SAÚDE ÓSSEA */
            ossea_1: {
                tag: "Saúde Óssea",
                title: "Diagnóstico de Osteoporose ou Osteopenia?",
                binary: true,
                yes: { result: "Encaminhamento médico e reforço das medidas não farmacológicas de suporte à saúde óssea.", urgent: true },
                no: { next: "ossea_2" }
            },
            ossea_2: {
                tag: "Saúde Óssea",
                title: "Apresenta fratura por fragilidade?",
                binary: true,
                yes: { result: "Considerar Risco de Queda e fraturas e encaminhamento médico.", urgent: true },
                no: { next: "ossea_3" }
            },
            ossea_3: {
                tag: "Saúde Óssea",
                title: "Apresenta dor articular?",
                binary: true,
                yes: { result: "Avaliação da causa, intensidade, duração e impacto funcional. Encaminhamento médico se necessário." },
                no: { next: "ossea_4" }
            },
            ossea_4: {
                tag: "Saúde Óssea",
                title: "Ingestão diária de Cálcio insuficiente (< 1000 mg/dia)?",
                binary: true,
                yes: { result: "Aconselhar suplemento de Cálcio para complementar a Ingestão diária." },
                no: { next: "ossea_5" }
            },
            ossea_5: {
                tag: "Saúde Óssea",
                title: "Níveis de Vitamina D3 inadequados (< 20 ng/mL)?",
                binary: true,
                yes: { result: "Aconselhar suplementação com Vitamina D3 (800-1000 UI/dia)." },
                no: { result: "Manter aporte adequado de Cálcio e Vitamina D3." }
            },

            /* 4. PERTURBAÇÕES DO SONO */
            sono_1: {
                tag: "Perturbações do Sono",
                title: "Está associada a afrontamentos e/ou suores noturnos?",
                binary: true,
                yes: { result: "Priorizar o alívio dos sintomas vasomotores." },
                no: { next: "sono_2" }
            },
            sono_2: {
                tag: "Perturbações do Sono",
                title: "Apresenta características sugestivas de insónia inicial ou secundária?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { next: "sono_3" }
            },
            sono_3: {
                tag: "Perturbações do Sono",
                title: "Sintomas de ansiedade, stress ou alterações do humor?",
                binary: true,
                yes: { result: "Medidas de higiene do sono e suplementar Melatonina ou Valeriana/Passiflora." },
                no: { result: "Medidas de higiene do sono e suplementar Melatonina." }
            },

            /* 5. ALTERAÇÕES PSICOLÓGICAS */
            psico_1: {
                tag: "Alterações Psicológicas",
                title: "Alteração marcada da personalidade, depressão ou ideação suicida?",
                binary: true,
                yes: { result: "Encaminhamento médico urgente.", urgent: true },
                no: { next: "psico_2" }
            },
            psico_2: {
                tag: "Alterações Psicológicas",
                title: "Apresenta instabilidade de humor?",
                binary: true,
                yes: { result: "Medidas gerais de suporte: exercício físico, sono, gestão do stress e apoio psicológico." },
                no: { result: "Manter medidas gerais de suporte." }
            },

            /* 6. ALTERAÇÕES COGNITIVAS */
            cog_1: {
                tag: "Alterações Cognitivas",
                title: "Sintomas graves e/ou incapacitantes?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { next: "cog_2" }
            },
            cog_2: {
                tag: "Alterações Cognitivas",
                title: "Consumo adequado de peixe gordo? (1 a 2 vezes por semana)",
                binary: true,
                yes: { result: "Manter aporte alimentar." },
                no: { result: "Considerar suplementação com Omega 3 (DHA e EPA)." }
            },

            /* 7. ALTERAÇÕES METABÓLICAS */
            meta_1: {
                tag: "Alterações Metabólicas",
                title: "Triglicéridos altos ou Risco Cardiovascular Elevado?",
                binary: true,
                yes: { result: "Considerar Omega 3 para reduzir a gordura visceral e proteger o coração." },
                no: { next: "meta_2" }
            },
            meta_2: {
                tag: "Alterações Metabólicas",
                title: "Diabetes Mellitus 2?",
                binary: true,
                yes: { result: "Encaminhar para consulta médica.", urgent: true },
                no: { result: "Manter estilo de vida saudável e monitorização regular." }
            },

            /* 8. ALTERAÇÕES CUTÂNEAS */
            cut_1: {
                tag: "Alterações Cutâneas",
                title: "Uso de Proteção Solar Diária (Prevenção de Fotoenvelhecimento)?",
                binary: true,
                yes: { next: "cut_2" },
                no: { result: "Aconselhar uso diário de fotoprotetor de amplo espectro (FPS 30-50+)." }
            },
            cut_2: {
                tag: "Alterações Cutâneas",
                title: "Apresenta rugas finas, flacidez ou perda de densidade na pele?",
                binary: true,
                yes: { result: "Aconselhar cosmética de estimulação lipídica/colagénio, emolientes de base pH e Ácido Hialurónico tópico." },
                no: { next: "cut_3" }
            },
            cut_3: {
                tag: "Alterações Cutâneas",
                title: "Apresenta queda de cabelo ou perda de volume capilar?",
                binary: true,
                yes: { result: "Dermocosméticos capilares e suplementar vitaminas do complexo B, Zinco e aminoácidos." },
                no: { result: "Manter rotina dermocosmética habitual." }
            }
        };

        function renderNode(nodeKey) {
            const app = document.getElementById('appContent');
            const node = treeData[nodeKey];

            if (!node) return;

            let html = `<div class="badge">${node.tag}</div>`;
            
            html += `<div class="question-card">`;
            html += `<div class="question-text">${node.title}</div>`;
            if (node.note) {
                html += `<div class="note-text">${node.note}</div>`;
            }
            html += `</div>`;

            if (node.binary) {
                html += `
                    <div class="binary-grid">
                        <button class="btn-decision yes" onclick="handleSelect('${nodeKey}', 'yes')">SIM</button>
                        <button class="btn-decision no" onclick="handleSelect('${nodeKey}', 'no')">NÃO</button>
                    </div>
                `;
            } else if (node.options) {
                html += `<div class="options-list">`;
                node.options.forEach((opt, idx) => {
                    html += `<button class="btn-select" onclick="handleSelect('${nodeKey}', ${idx})">${opt.text} <span>→</span></button>`;
                });
                html += `</div>`;
            }

            app.innerHTML = html;
        }

        function handleSelect(nodeKey, choice) {
            const node = treeData[nodeKey];
            let target;

            if (node.binary) {
                target = node[choice];
            } else if (node.options) {
                target = node.options[choice];
            }

            if (target.result) {
                showResult(target.result, target.urgent, target.next);
            } else if (target.next) {
                renderNode(target.next);
            }
        }

        function showResult(text, isUrgent = false, nextStep = null) {
            const app = document.getElementById('appContent');
            const resultClass = isUrgent ? 'urgent' : 'info';
            const icon = isUrgent ? '⚠️' : '💡';
            const titleText = isUrgent ? 'Encaminhamento Médico / Alerta Clínico' : 'Recomendação / Orientação Farmacêutica';

            let html = `
                <div class="result-box ${resultClass}">
                    <div class="result-title"><span>${icon}</span> ${titleText}</div>
                    <div>${text}</div>
                </div>
            `;

            if (nextStep) {
                html += `<button class="btn-primary-action" onclick="renderNode('${nextStep}')">Prosseguir para Próxima Avaliação →</button>`;
            } else {
                html += `<button class="btn-primary-action" onclick="renderNode('q_predominante')">➕ Avaliar Outro Sintoma</button>`;
            }

            html += `<button class="btn-secondary-action" onclick="resetSession()">🔄 Reiniciar Algoritmo</button>`;

            app.innerHTML = html;
        }

        function resetSession() {
            renderNode('start');
        }

        renderNode('start');
    </script>

</body>
</html>
