
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo de Apoio à Decisão - Menopausa</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #006699;
            --primary-dark: #004d73;
            --secondary: #00a88f;
            --bg-body: #f4f7f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #d9534f;
            --warning: #f0ad4e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Source Sans Pro', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .top-bar {
            width: 100%;
            max-width: 720px;
            background-color: var(--primary);
            color: #ffffff;
            padding: 12px 20px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 720px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
            border-top: none;
            overflow: hidden;
        }

        .header-hero {
            background: linear-gradient(135deg, #006699 0%, #00a88f 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header-hero h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0;
        }

        .content {
            padding: 28px 24px;
        }

        .step-tag {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .asterisk-note {
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: #f8fafc;
            border-left: 3px solid var(--primary);
            padding: 8px 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-option {
            background: #ffffff;
            border: 2px solid var(--border);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-option:hover {
            border-color: var(--primary);
            background-color: #f0f7fa;
            color: var(--primary);
        }

        .binary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-binary {
            text-align: center;
            justify-content: center;
            font-size: 1.1rem;
            padding: 16px;
        }

        .btn-binary.yes:hover {
            background-color: #f0fdf4;
            border-color: #16a34a;
            color: #15803d;
        }

        .btn-binary.no:hover {
            background-color: #fef2f2;
            border-color: #dc2626;
            color: #b91c1c;
        }

        .result-box {
            background-color: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-box h3 {
            font-size: 1.15rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .notice-card {
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .notice-card.urgent {
            background-color: #fef2f2;
            border-left: 5px solid var(--danger);
            color: #991b1b;
        }

        .notice-card.success {
            background-color: #f0fdf4;
            border-left: 5px solid var(--secondary);
            color: #166534;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }

        .btn-action:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary-action {
            background-color: #ffffff;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary-action:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>ALGORITMO DE DECISÃO CLÍNICA</span>
        <span>SAÚDE NA MENOPAUSA</span>
    </div>

    <div class="container">
        <div class="header-hero">
            <h1>Aconselhamento de Produtos de Saúde na Menopausa</h1>
        </div>

        <div class="content" id="appContent">
            <!-- Renderizado dinamicamente via JS -->
        </div>
    </div>

    <script>
        let sessionEvaluations = [];

        const treeData = {
            /* TRIAGEM INICIAL E NOVO DIAGRAMA DE FLUXO INTEGRADO */
            q_precoce: {
                tag: "Triagem Inicial",
                title: "Histórico de menopausa precoce?",
                binary: true,
                yes: { result: "Encaminhamento médico para avaliação de menopausa precoce (<45 anos) ou Insuficiência ovárica prematura (<40 anos).", urgent: true },
                no: { next: "q_imc" }
            },
            q_imc: {
                tag: "Avaliação Antropométrica",
                title: "Índice de Massa Corporal (IMC) > 27?",
                binary: true,
                yes: { result: "Perda ponderal de 10% associada à redução da intensidade dos afrontamentos. Reforçar a importância da dieta equilibrada e de exercício físico.", next: "q_evitar_hormonas" },
                no: { next: "q_evitar_hormonas" }
            },
            q_evitar_hormonas: {
                tag: "Opção Terapêutica",
                title: "A utente prefere evitar hormonas?",
                binary: true,
                yes: { next: "q_menqol" },
                no: { result: "Encaminhamento médico para avaliação de terapêutica hormonal.", urgent: true }
            },
            q_menqol: {
                tag: "Avaliação de Impacto (MENQOL*)",
                title: "Os sintomas são graves, persistentes ou apresentam impacto significativo na qualidade de vida?",
                note: "*MENQOL (Menopause-Specific Quality of Life Questionnaire): Questionário validated de avaliação da qualidade de vida específica da menopausa.",
                binary: true,
                yes: { result: "Encaminhamento para consulta médica devido a elevado impacto na qualidade de vida.", urgent: true },
                no: { next: "q_predominante" }
            },
            q_predominante: {
                tag: "Sintoma A Avaliar",
                title: "Qual o sintoma predominante?",
                options: [
                    { text: "1. Sintomas Vasomotores (Afrontamentos / Suores noturnos)", next: "vasomotores_cancro" },
                    { text: "2. Sintomas Geniturinários", next: "genitu_1" },
                    { text: "3. Saúde Óssea", next: "ossea_1" },
                    { text: "4. Perturbações do Sono", next: "sono_1" },
                    { text: "5. Alterações Psicológicas", next: "psico_1" },
                    { text: "6. Alterações Cognitivas", next: "cog_1" },
                    { text: "7. Alterações Metabólicas", next: "meta_1" },
                    { text: "8. Alterações Cutâneas", next: "cut_1" }
                ]
            },

            /* 1. VASOMOTORES (SEGUNDO FLUXOGRAMA INTEGRADO) */
            vasomotores_cancro: {
                tag: "Vasomotores",
                title: "Histórico de Cancro Hormono-dependente? (Mama, Endométrio)",
                binary: true,
                yes: { result: "Precaução com fitoestrogénios ex: Soja (Glycine max), Trevo Vermelho (Trifolium pratense). Recomenda-se acompanhamento médico.", urgent: true },
                no: { next: "vasomotores_hepatica" }
            },
            vasomotores_hepatica: {
                tag: "Vasomotores",
                title: "Patologia Hepática?",
                binary: true,
                yes: { next: "vasomotores_antidepressivos", alertHepatic: true },
                no: { next: "vasomotores_antidepressivos" }
            },
            vasomotores_antidepressivos: {
                tag: "Vasomotores",
                title: "Utente toma antidepressivos?",
                binary: true,
                yes: { result: "Evitar erva-de-são-joão (Hypericum perforatum) devido ao risco de síndrome serotoninérgica e interações medicamentosas." },
                no: { result: "Sintomas Vasomotores: Considerar Isoflavonas de Soja (Glycine max) ou Extrato de Pólen Purificado de acordo com o perfil da utente." }
            },

            /* 2. GENITURINÁRIOS */
            genitu_1: {
                tag: "Geniturinários",
                title: "Apresenta hemorragia pós-menopausa?",
                binary: true,
                yes: { result: "Sintomas Geniturinários: Encaminhamento médico imediato por hemorragia pós-menopausa.", urgent: true },
                no: { next: "genitu_2" }
            },
            genitu_2: {
                tag: "Geniturinários",
                title: "Apresenta sintomas sugestivos de infeção urinária ou candidíase?",
                binary: true,
                yes: { result: "Sintomas Geniturinários: Encaminhamento médico por suspeita de infeção.", urgent: true },
                no: { next: "genitu_3" }
            },
            genitu_3: {
                tag: "Geniturinários",
                title: "Apresenta secura, ardor ou desconforto vaginal?",
                binary: true,
                yes: { result: "Sintomas Geniturinários: Hidratantes Vaginais Não Hormonais (com ácido hialurónico, fitoestrogénios, pectina). Utilização regular 2 a 3 vezes/semana." },
                no: { next: "genitu_4" }
            },
            genitu_4: {
                tag: "Geniturinários",
                title: "Existe dor/desconforto apenas no coito (Dispareunia)?",
                binary: true,
                yes: { result: "Sintomas Geniturinários: Lubrificantes vaginais durante a atividade sexual (Verificar compatibilidade com preservativos de látex)." },
                no: { result: "Sintomas Geniturinários: Reavaliar sintomatologia local e promover higiene íntima adequada." }
            },

            /* 3. SAÚDE ÓSSEA */
            ossea_1: {
                tag: "Saúde Óssea",
                title: "Diagnóstico de Osteoporose ou Osteopenia?",
                binary: true,
                yes: { result: "Saúde Óssea: Encaminhamento médico e reforço das medidas não farmacológicas de suporte à saúde óssea.", urgent: true },
                no: { next: "ossea_2" }
            },
            ossea_2: {
                tag: "Saúde Óssea",
                title: "Apresenta fratura por fragilidade?",
                binary: true,
                yes: { result: "Saúde Óssea: Considerar Risco de Queda e fraturas e encaminhamento médico.", urgent: true },
                no: { next: "ossea_3" }
            },
            ossea_3: {
                tag: "Saúde Óssea",
                title: "Apresenta dor articular?",
                binary: true,
                yes: { result: "Saúde Óssea: Avaliação da causa, intensidade, duração e impacto funcional. Encaminhamento médico se necessário." },
                no: { next: "ossea_4" }
            },
            ossea_4: {
                tag: "Saúde Óssea",
                title: "Ingestão diária de Cálcio insuficiente (< 1000 mg/dia)?",
                binary: true,
                yes: { result: "Saúde Óssea: Aconselhar suplemento de Cálcio para complementar a ingestão diária." },
                no: { next: "ossea_5" }
            },
            ossea_5: {
                tag: "Saúde Óssea",
                title: "Níveis de Vitamina D3 inadequados (< 20 ng/mL)?",
                binary: true,
                yes: { result: "Saúde Óssea: Aconselhar suplementação com Vitamina D3 (800-1000 UI/dia)." },
                no: { result: "Saúde Óssea: Manter aporte adequado de cálcio e Vitamina D3." }
            },

            /* 4. SONO */
            sono_1: {
                tag: "Perturbações do Sono",
                title: "Está associada a afrontamentos e/ou suores noturnos?",
                binary: true,
                yes: { result: "Perturbações do Sono: Priorizar o alívio dos sintomas vasomotores (avaliar queixas vasomotores)." },
                no: { next: "sono_2" }
            },
            sono_2: {
                tag: "Perturbações do Sono",
                title: "Apresenta características sugestivas de insónia inicial ou secundária?",
                binary: true,
                yes: { result: "Perturbações do Sono: Encaminhamento médico.", urgent: true },
                no: { next: "sono_3" }
            },
            sono_3: {
                tag: "Perturbações do Sono",
                title: "Sintomas de ansiedade, stress ou alterações do humor?",
                binary: true,
                yes: { result: "Perturbações do Sono: Medidas de higiene do sono e suplementar Melatonina ou Valeriana/Passiflora." },
                no: { result: "Perturbações do Sono: Medidas de higiene do sono e suplementar Melatonina." }
            },

            /* 5. PSICOLÓGICAS */
            psico_1: {
                tag: "Alterações Psicológicas",
                title: "Alteração marcada da personalidade, depressão ou ideação suicida?",
                binary: true,
                yes: { result: "Alterações Psicológicas: Encaminhamento médico urgente.", urgent: true },
                no: { next: "psico_2" }
            },
            psico_2: {
                tag: "Alterações Psicológicas",
                title: "Apresenta instabilidade de humor?",
                binary: true,
                yes: { result: "Alterações Psicológicas: Medidas gerais de suporte: exercício físico, sono, gestão do stress e apoio psicológico." },
                no: { result: "Alterações Psicológicas: Manter medidas gerais de suporte." }
            },

            /* 6. COGNITIVAS */
            cog_1: {
                tag: "Alterações Cognitivas",
                title: "Sintomas graves e/ou incapacitantes?",
                binary: true,
                yes: { result: "Alterações Cognitivas: Encaminhamento médico.", urgent: true },
                no: { next: "cog_2" }
            },
            cog_2: {
                tag: "Alterações Cognitivas",
                title: "Consumo adequado de peixe gordo? (1 a 2 vezes por semana)",
                binary: true,
                yes: { result: "Alterações Cognitivas: Manter aporte alimentar." },
                no: { result: "Alterações Cognitivas: Considerar suplementação com Omega 3 (DHA e EPA)." }
            },

            /* 7. METABÓLICAS */
            meta_1: {
                tag: "Alterações Metabólicas",
                title: "Triglicéridos altos ou Risco Cardiovascular Elevado?",
                binary: true,
                yes: { result: "Alterações Metabólicas: Omega 3 para reduzir a gordura visceral e proteger o coração." },
                no: { next: "meta_2" }
            },
            meta_2: {
                tag: "Alterações Metabólicas",
                title: "Diabetes Mellitus 2?",
                binary: true,
                yes: { result: "Alterações Metabólicas: Encaminhar para consulta médica.", urgent: true },
                no: { result: "Alterações Metabólicas: Manter estilo de vida saudável e monitorização regular." }
            },

            /* 8. CUTÂNEAS */
            cut_1: {
                tag: "Alterações Cutâneas",
                title: "Uso de Proteção Solar Diária (Prevenção de Fotoenvelhecimento)?",
                binary: true,
                yes: { next: "cut_2" },
                no: { result: "Alterações Cutâneas: Aconselhar uso diário de fotoprotetor de amplo espectro (FPS 30-50+)." }
            },
            cut_2: {
                tag: "Alterações Cutâneas",
                title: "Apresenta rugas finas, flacidez ou perda de densidade na pele?",
                binary: true,
                yes: { result: "Alterações Cutâneas: Aconselhar cosmética de estimulação lipídica/colagénio, emolientes de base pH e Ácido Hialurónico tópico." },
                no: { next: "cut_3" }
            },
            cut_3: {
                tag: "Alterações Cutâneas",
                title: "Apresenta queda de cabelo ou perda de volume capilar?",
                binary: true,
                yes: { result: "Alterações Cutâneas: Dermocosméticos capilares e suplementar vitaminas do complexo B, zinco e aminoácidos." },
                no: { result: "Alterações Cutâneas: Manter rotina dermocosmética habitual." }
            }
        };

        function renderNode(nodeKey) {
            const app = document.getElementById('appContent');
            const node = treeData[nodeKey];

            if (!node) return;

            let html = `<span class="step-tag">${node.tag}</span>`;
            html += `<h2 class="question-title">${node.title}</h2>`;

            if (node.note) {
                html += `<div class="asterisk-note">${node.note}</div>`;
            }

            if (node.binary) {
                html += `
                    <div class="binary-grid">
                        <button class="btn-option btn-binary yes" onclick="handleSelect('${nodeKey}', 'yes')">Sim</button>
                        <button class="btn-option btn-binary no" onclick="handleSelect('${nodeKey}', 'no')">Não</button>
                    </div>
                `;
            } else if (node.options) {
                html += `<div class="options-list">`;
                node.options.forEach((opt, idx) => {
                    html += `<button class="btn-option" onclick="handleSelect('${nodeKey}', ${idx})">${opt.text} <span>→</span></button>`;
                });
                html += `</div>`;
            }

            app.innerHTML = html;
        }

        function handleSelect(nodeKey, choice) {
            const node = treeData[nodeKey];
            let target;

            if (node.binary) {
                target = node[choice];
            } else if (node.options) {
                target = node.options[choice];
            }

            if (target.result) {
                showResult(target.result, target.urgent);
            } else if (target.next) {
                renderNode(target.next);
            }
        }

        function showResult(text, isUrgent = false) {
            const app = document.getElementById('appContent');
            
            sessionEvaluations.push({ text, isUrgent });

            let html = `<h2 class="question-title" style="text-align: center; margin-bottom: 16px;">Recomendações Clínicas da Utente</h2>`;
            
            sessionEvaluations.forEach((item, index) => {
                const cardClass = item.isUrgent ? 'urgent' : 'success';
                const cardTitle = item.isUrgent ? '🔴 Encaminhamento / Recomendação Clínica' : '💊 Orientação / Aconselhamento Farmacêutico';
                
                html += `
                    <div class="result-box">
                        <h3>${cardTitle} #${index + 1}</h3>
                        <div class="notice-card ${cardClass}">
                            ${item.text}
                        </div>
                    </div>
                `;
            });

            html += `
                <button class="btn-action" onclick="renderNode('q_predominante')">➕ Avaliar Outro Sintoma da Utente</button>
                <button class="btn-secondary-action" onclick="resetFullSession()">🔄 Iniciar Nova Utente (Limpar Tudo)</button>
            `;

            app.innerHTML = html;
        }

        function resetFullSession() {
            sessionEvaluations = [];
            renderNode('q_precoce');
        }

        renderNode('q_precoce');
    </script>

</body>
</html>
